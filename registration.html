<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Epunda+Slab:ital,wght@0,300..900;1,300..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <!--BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
  <style>

    #registrationContainer input.form-control::placeholder {
      color: #bfbfbf;
    }
      
    #registrationContainer button.btn {
      width: 100%;
      max-width: 200px;
      margin: 5px 0;
    }

    #registrationContainer {
        background-color: rgba(0, 0, 0, 0.65);
        padding: 60px;
        border-radius: 15px;
        width: 85%;
        margin: 50px auto;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #registrationContainer #ProfileImg {
        display: block;
        margin: 0 auto 20px auto;
    }

    #registrationContainer #NoFileBtn {
        margin-top: 5px;
        font-size: 0.9rem;
    }

    #pfpImg {
        text-align: center;
    }
        
    </style>
    
</head>
<body>

    <!-- NAVBAR -->
<nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-dark" id="nav-bar">
    <div class="container-fluid">

        <!--LEFT SIDE-->
        <a class="navbar-brand" href="#">
            <img src="LOGO HERE" width="40" height="40" alt="Logo" href="index.html#home"> MRT-3 Fare Matrix
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html#home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="index.html#fareMatrix">Fare Matrix</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Schedule</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Help</a>
                </li>
            </ul>
        </div>

        <!--RIGHT SIDE-->
        <div class="ms-auto">
            <button type="button" class="btn btn-link">Book Now</button>
            <a href="registration.html" target="_self" class="btn btn-primary">Create Account</a>
        </div>
    </div> 
</nav>
    <!-- END OF NAV -->

<!-- REGISTRATION FORM-->
<main class="container text-light" id="registrationContainer">

<div class="profile-section">
    <img src="transparent.png" id="ProfileImg" class="ProfileImg">
    <p id="pfpImg">Profile Image</p>
    <div class="ChoosingProfile mt-2">
        <label class="btn btn-secondary">
            <input type="file" name="options" id="ChooseFile" autocomplete="off">
        </label>
    </div>
</div>

    <!-- Registration Form -->
    <form class="mx-auto" style="max-width: 400px;">
        <h1 class="text-center mb-3">Registration</h1>

        <div class="row mb-3">
            <div class="col">
                <label>First Name</label>
                <input type="text" class="form-control" id="inputFirstName" placeholder="Enter">
            </div>
            <div class="col">
                <label>Last Name</label>
                <input type="text" class="form-control" id="inputLastName" placeholder="Enter">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label>Age</label>
                <input type="number" class="form-control" id="inputAge" placeholder="0">
            </div>
            <div class="col">
                <label>Contact Number</label>
                <input type="number" class="form-control" id="inputContact" placeholder="000-000-0000">
            </div>
        </div>

        <label>Email</label>
        <input type="email" class="form-control mb-3" id="inputEmail" placeholder="enter@email.com">

        <label>Username</label>
        <input type="text" class="form-control mb-3" id="inputUsername" placeholder="Enter">

        <label>Password</label>
        <input type="password" class="form-control mb-3" id="inputPassword" placeholder="Enter">

        <label>Confirm Password</label>
        <input type="password" class="form-control mb-3" id="confirmPassword" placeholder="Re-enter">

        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="acceptTerms">
            <label class="form-check-label" for="acceptTerms">
                I accept the <span style="color:blue;">Terms and Conditions</span>
            </label>
        </div>

        <button type="submit" class="btn btn-primary w-100">Sign-Up</button>
    </form>
</main>

    <!-- FOOTER -->
    <footer class="bg-dark text-light mt-5" id="footer">
        <div class="container py-4 text-center">
            <p class="mb-1">Hans Baquiran, Isabelle Cabatu, Dwayne Chua, Mikela Santiago, Lizzie Vistro | 9 Emerald &copy;2026</p>
            <p class="mb-1">Source: <a href="https://www.metrolinemap.com/metro/manila/">Manila Metro Rail Transit</a></p>
        </div>
    </footer>

    <script src="proj.js"></script>

</body>

</html>
