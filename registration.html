<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!--BOOTSTRAP-->    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!--EXTERNAL CSS-->    
    <link rel="stylesheet" href="styles.css">

</head>
<body>

    <!-- NAVBAR -->
<nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-dark" id="nav-bar">
    <div class="container-fluid">

        <!--LEFT SIDE-->
        <a class="navbar-brand" href="#">
            <img src="LOGO HERE" width="40" height="40" alt="Logo"> MRT-3 Fare Matrix
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="#home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="index.html#fareMatrix">Fare Matrix</a> <!-- (will edit) DONT ADD FARE MATRIX??? -->
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Schedule</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Help</a>
                </li>
            </ul>
        </div>

        <!--RIGHT SIDE-->
        <div class="ms-auto">
            <button type="button" class="btn btn-link">Book Now</button>
            <a href="registration.html" target="_self" class="btn btn-primary">Create Account</a>
        </div>
    </div> 
</nav>
    <!-- END OF NAV -->
    
    <div class="container">
        <div class="row">
            <div class="col-sm-6">
                <img src="" height="80" id="ProfileImg">
                <br>
                <div class="btn-group btn-group-toggle" data-toggle="buttons">
                    <label class="btn btn-secondary">
                        <input type="file" name="options" id="ChooseFile" autocomplete="off"> 
                    </label>
                    <label class="btn btn-secondary">
                        <input class="btn btn-secondary" id="NoFileBtn" autocomplete="off"> No File Chosen
                    </label>
                </div>
            </div>
            <div class="col-sm-6">
                <form>
                    <h2>REGISTRATION</h2>
                    <br>
                    <br>
                    <div class="row">
                        <!--NAME-->
                        <div class="col">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" id="inputFirstName" placeholder="Enter">
                            <br>
                        </div>
                        <div class="col">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="inputLastName" placeholder="Enter">
                            <br>
                        </div>
                    </div>
                    <div class="row">       
                        <!--AGE-->
                        <div class="col">
                            <label class="form-label">Age</label>
                            <input type="number" class="form-control" id="inputAge" placeholder="0">
                        </div>
                        <!--CONTACT-->
                        <div class="col">
                            <label class="form-label">Contact Number</label>
                            <input type="number" class="form-control" id="inputContact" placeholder="000-000-0000">
                            <br>
                        </div>
                    </div>

                    <!--EMAIL-->
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="inputEmail" placeholder="enter@email.com">
                        <br>

                    <!--USERNAME-->
                        <label class="form-label">Enter a Username</label>
                        <input type="text" class="form-control" id="inputUsername" placeholder="Enter">
                        <br>

                    <!--PASSWORD-->
                        <label class="form-label">Enter a Password</label>
                        <input type="password" class="form-control" id="inputPassword" placeholder="Enter">
                        <br>
                        <label class="form-label">Confrim Password</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter">
                        <br>

                    <!--TERMS&CONDITIONS-->
                        <input type="checkbox" id="acceptTerms&Conditions">
                        <label>I accept the <span style="color:blue;">Terms and Conditions</span></label>
                        <br>
                        <br>

                    <!--SIGN-UP-->
                        <button type="submit" class="btn btn-primary">Sign-Up</button>
                </form>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-light mt-5" id="footer">
        <div class="container py-4 text-center">
            <p class="mb-1">Hans Baquiran, Isabelle Cabatu, Dwayne Chua, Mikela Santiago, Lizzie Vistro | 9 Emerald &copy;2026</p>
            <p class="mb-1">Source: <a href="https://www.metrolinemap.com/metro/manila/">Manila Metro Rail Transit</a></p>
        </div>
    </footer>

    <script src=proj.js"></script>

</body>

</html>
